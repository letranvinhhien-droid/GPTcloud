# Creates paid Render resources. Review the service and disk price in Render.
services:
  - type: web
    name: meridian-lms
    runtime: node
    region: singapore
    plan: starter
    numInstances: 1
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: LMS_DEMO
        value: "false"
      - key: LMS_SEED
        value: "false"
      - key: LMS_COOKIE_SECURE
        value: "true"
      - key: LMS_DB
        value: /var/data/lms.sqlite
    disk:
      name: meridian-data
      mountPath: /var/data
      sizeGB: 1
